<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Alışveriş Asistanı</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117; /* Karanlık Arka Plan */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 650px;
            height: 85vh;
            background: #ffffff; /* Beyaz Chatbot Teması */
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            font-weight: bold;
            text-align: center;
            font-size: 18px;
            letter-spacing: 0.5px;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #f8fafc;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }
        .user-message {
            background: #4f46e5;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .bot-message {
            background: white;
            color: #1f2937;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }
        .product-card {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: transform 0.2s;
        }
        .product-card:hover {
            border-color: #4f46e5;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
        }
        .product-title {
            font-weight: 600;
            color: #0f172a;
            font-size: 13px;
        }
        .product-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }
        .product-price {
            color: #059669;
            font-weight: bold;
            font-size: 15px;
        }
        .product-platform {
            background: #e0e7ff;
            color: #3730a3;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .product-btn {
            display: block;
            background: #4f46e5;
            color: white;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .product-btn:hover {
            background: #4338ca;
        }
        .chat-input-area {
            padding: 16px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        .chat-input-area input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .chat-input-area button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .chat-input-area button:hover {
            background: #4338ca;
        }
        .loading {
            font-style: italic;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🛍️ AI Alışveriş Asistanı</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">Merhaba! Ben AI alışveriş asistanınım. Ne aramak istiyorsun? (Örn: <i>"v yaka t-shirt"</i> veya <i>"laptop"</i>)</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Bir ürün arayın..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script>
    const API_URL = "http://127.0.0.1:8000/api/search";

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const query = inputField.value.trim();
        if (!query) return;

        appendMessage(query, 'user-message');
        inputField.value = "";

        const loadingId = appendMessage("Ürünler taranıyor, lütfen bekleyin...", 'bot-message loading');

        try {
            const response = await fetch(`${API_URL}?q=${encodeURIComponent(query)}`);
            const data = await response.json();

            document.getElementById(loadingId).remove();

            if (data.products && data.products.length > 0) {
                let botHtml = `<div style="margin-bottom:10px;">${data.reply || `"${query}" için bulduğum en iyi fırsatlar:`}</div>`;
                data.products.forEach(p => {
                    botHtml += `
                        <div class="product-card">
                            <span class="product-platform">${p.platform}</span>
                            <div class="product-title">${p.title}</div>
                            <div class="product-info">
                                <span class="product-price">${p.price} TL</span>
                            </div>
                            <a href="${p.url}" target="_blank" class="product-btn">Ürüne Git ↗</a>
                        </div>
                    `;
                });
                appendMessage(botHtml, 'bot-message', true);
            } else {
                appendMessage(`Üzgünüm, "${query}" için maalesef sonuç bulamadım.`, 'bot-message');
            }
        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage("Sunucuya bağlanırken bir hata oluştu. Backend'in açık olduğundan emin ol.", 'bot-message');
        }
    }

    function appendMessage(text, className, isHtml = false) {
        const messagesDiv = document.getElementById("chatMessages");
        const msgDiv = document.createElement("div");
        const msgId = 'msg-' + Date.now();
        msgDiv.id = msgId;
        msgDiv.className = `message ${className}`;
        
        if (isHtml) {
            msgDiv.innerHTML = text;
        } else {
            msgDiv.innerText = text;
        }

        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        return msgId;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
